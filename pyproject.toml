[project]
name = "phalanx"
version = "0.1.0"
description = "Read-only Korean stock portfolio snapshots"
readme = "README.md"
authors = [
    { name = "Hansol Choi", email = "198446733+bigpine-choi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.32.4",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
phalanx = "phalanx:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
addopts = [
    "--disable-socket",
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["phalanx"]
